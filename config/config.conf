#=============================================================
# NishantX Framework Configuration
#=============================================================

# --- General ---
THREADS=10
TIMEOUT=300
RATE_LIMIT=100
RETRY_COUNT=2
USER_AGENT="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36"

# --- Output ---
OUTPUT_BASE="results"
LOG_LEVEL="INFO"
SILENT=false
VERBOSE=false

# --- Scan Modes ---
DEEP_SCAN=false
STEALTH_MODE=false
AGGRESSIVE_MODE=false

# --- API Keys ---
SHODAN_API_KEY=""
CENSYS_API_ID=""
CENSYS_API_SECRET=""
VIRUSTOTAL_API_KEY=""
SECURITYTRAILS_API_KEY=""
GITHUB_TOKEN=""
CHAOS_API_KEY=""
NUCLEI_API_KEY=""

# --- Wordlists ---
WORDLIST_DIR="/usr/share/wordlists"
DIRS_WORDLIST="/usr/share/wordlists/dirb/common.txt"
DNS_WORDLIST="/usr/share/wordlists/dnsrecon/namelist.txt"
PARAMS_WORDLIST="/usr/share/wordlists/seclists/Discovery/Web-Content/burp-parameter-names.txt"
FUZZ_WORDLIST="/usr/share/wordlists/seclists/Discovery/Web-Content/raft-medium-directories.txt"

# --- Nuclei ---
NUCLEI_TEMPLATES_DIR="$HOME/nuclei-templates"
NUCLEI_SEVERITY="critical,high,medium"
NUCLEI_TAGS=""

# --- Notifications ---
NOTIFY=false
TELEGRAM_BOT_TOKEN=""
TELEGRAM_CHAT_ID=""
DISCORD_WEBHOOK_URL=""
SLACK_WEBHOOK_URL=""

# --- Ports ---
PORT_TOP_PORTS=1000
PORT_SCAN_RATE=1000
PORT_EXCLUDE=""

# --- HTTP ---
HTTP_PROXY=""
CUSTOM_HEADERS=""
FOLLOW_REDIRECTS=true
MAX_REDIRECTS=5

# --- Screenshots ---
SCREENSHOT_TIMEOUT=10
SCREENSHOT_WIDTH=1920
SCREENSHOT_HEIGHT=1080

# --- SQLMap ---
SQLMAP_LEVEL=3
SQLMAP_RISK=2
SQLMAP_TAMPER=""

# --- Cloud ---
AWS_WORDS="/usr/share/wordlists/seclists/Discovery/DNS/aws.txt"

# --- Resume ---
RESUME=false
RESUME_FILE=""
